<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NotebookLM Tags</title>
  <link rel="stylesheet" href="sidepanel.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- ─── Top Bar ─────────────────────────────────────── -->
  <header class="sp-header">
    <h1 class="sp-title">NotebookLM Tags</h1>
    <div class="sp-filter-buttons">
      <div class="sp-filter-wrapper" id="tagFilterWrapper">
        <button class="sp-filter-btn" id="btnFilterTags">
          <svg class="sp-btn-icon" viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
          Filter by Tags
          <span class="sp-badge" id="tagBadge">0</span>
        </button>
        <div class="sp-dropdown" id="tagDropdown"></div>
      </div>
      <div class="sp-filter-wrapper" id="sourceFilterWrapper">
        <button class="sp-filter-btn" id="btnFilterSources">
          <svg class="sp-btn-icon" viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
          Filter by Sources
          <span class="sp-badge" id="sourceBadge">0</span>
        </button>
        <div class="sp-dropdown" id="sourceDropdown"></div>
      </div>
    </div>
  </header>

  <!-- ─── Message Table ───────────────────────────────── -->
  <div class="sp-table-wrapper">
    <table class="sp-table" id="messageTable">
      <thead>
        <tr>
          <th class="sp-th-message">Message</th>
          <th class="sp-th-meta">Tags / Sources</th>
        </tr>
      </thead>
      <tbody id="messageTableBody">
        <!-- Rows injected by JS -->
      </tbody>
    </table>
    <div class="sp-empty-state" id="emptyState">
      <svg class="sp-empty-icon" viewBox="0 0 48 48"><path d="M24 4C12.96 4 4 12.96 4 24s8.96 20 20 20 20-8.96 20-20S35.04 4 24 4zm2 30h-4v-4h4v4zm0-8h-4V14h4v12z" fill="currentColor" opacity="0.3"/></svg>
      <p>No messages found yet.</p>
      <p class="sp-empty-hint">Open a NotebookLM notebook and start chatting!</p>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
